name: Build Android APK (Production)

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;21.4.7075529'
          accept-android-sdk-licenses: true

      - name: Export Android env
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_REVERB_HOST: ${{ secrets.EXPO_PUBLIC_REVERB_HOST }}

      - name: Overwrite debug.keystore with stable keystore
        run: |
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE }}" | base64 --decode > android/app/debug.keystore
          chmod 600 android/app/debug.keystore
          echo "✅ Keystore SHA-1:"
          keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android | grep SHA1

      - name: Patch signing config to use debug for release
        run: |
          cd android/app
          python3 << 'PYEOF'
          import re
          with open('build.gradle') as f:
              content = f.read()

          # Ganti semua signingConfig debug di release block → tetap debug (kalau belum)
          # Cari release block dan pastikan pakai debug
          pattern = re.compile(
              r"(release\s*\{[^}]*signingConfig\s+signingConfigs\.)\w+",
              re.DOTALL
          )
          m = pattern.search(content)
          if m and m.group(0):
              print(f"Before: ...{m.group(0)[-60:]}")
              content = pattern.sub(r"\1debug", content)
              with open('build.gradle', 'w') as f:
                  f.write(content)
              print("✅ Patched release → signingConfigs.debug")
          else:
              print("⚠️ Release signingConfig pattern tidak ketemu")
          PYEOF

          echo ""
          echo "=== build.gradle signingConfig ==="
          grep -n "signingConfig signingConfigs" build.gradle || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_REVERB_HOST: ${{ secrets.EXPO_PUBLIC_REVERB_HOST }}

      - name: Verify APK SHA-1
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "=== APK SHA-1 fingerprint ==="
          keytool -printcert -jarfile "$APK" | grep SHA1 || true

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
