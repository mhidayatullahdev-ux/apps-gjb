name: Build iOS Simulator App

on:
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-13
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - run: npm install --legacy-peer-deps
      
      - run: npx expo prebuild --platform ios --clean
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_REVERB_HOST: ${{ secrets.EXPO_PUBLIC_REVERB_HOST }}

      - run: |
          cd ios
          pod install --repo-update

      - id: find-ws
        run: |
          cd ios
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace=$WS" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT

      - run: |
          cd ios
          xcodebuild \
            -workspace "${{ steps.find-ws.outputs.workspace }}" \
            -scheme "${{ steps.find-ws.outputs.scheme }}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -destination 'generic/platform=iOS Simulator' \
            build
        env:
          NODE_ENV: development
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_REVERB_HOST: ${{ secrets.EXPO_PUBLIC_REVERB_HOST }}

      - run: |
          cd ios
          APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -name "*.app" -maxdepth 1 | head -1)
          zip -r app-simulator.zip "$APP_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: app-ios-simulator
          path: ios/app-simulator.zip
