name: Build iOS Simulator App

on:
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_REVERB_HOST: ${{ secrets.EXPO_PUBLIC_REVERB_HOST }}

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Find workspace and scheme
        id: find-ws
        run: |
          cd ios
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace=$WS" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT

      - name: Build for Simulator (Release)
        run: |
          cd ios
          xcodebuild \
            -workspace "${{ steps.find-ws.outputs.workspace }}" \
            -scheme "${{ steps.find-ws.outputs.scheme }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -destination 'generic/platform=iOS Simulator' \
            build
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_REVERB_HOST: ${{ secrets.EXPO_PUBLIC_REVERB_HOST }}

      - name: Package App
        run: |
          cd ios
          # Path diubah ke Release-iphonesimulator
          APP_PATH=$(find build/Build/Products/Release-iphonesimulator -name "*.app" -maxdepth 1 | head -1)
          APP_NAME=$(basename "$APP_PATH")
          echo "✅ Found app: $APP_NAME"
          
          # Masuk ke folder tempat .app berada
          cd build/Build/Products/Release-iphonesimulator/
          
          # Zip file .app langsung di dalam root
          zip -r ../../../../app-simulator.zip "$APP_NAME"
          ls -lh ../../../../app-simulator.zip

      - name: Upload Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-simulator
          path: ios/app-simulator.zip
          retention-days: 30
